<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#07141c"/>
<title>Binaural Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#07141c;color:#f3ead8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 40px;text-align:center}
#hero{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4;opacity:.68;background:#07141c}
.wash{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(7,20,28,.12),rgba(7,20,28,.78))}
h1{font-weight:300;letter-spacing:.22em;font-size:1.12rem;margin:8px 0 14px;color:#e8c36a}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;max-width:640px}
button{background:rgba(7,20,28,.55);border:1px solid rgba(232,195,106,.3);color:#f3ead8;padding:10px 14px;border-radius:28px;font-size:.86rem}
button.on{background:linear-gradient(135deg,rgba(212,175,55,.92),rgba(46,196,182,.55));color:#0b1418;font-weight:600}
#setHero{border-color:#e8c36a;color:#e8c36a;margin-bottom:10px}
#play{width:78px;height:78px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f0d78a,#d4af37 46%,#1a7f78);color:#0b1418;font-weight:600;margin:12px 0 16px}
.vol{width:min(320px,92vw);text-align:left;font-size:.74rem;color:rgba(243,234,216,.75);margin:7px 0}
input[type=range]{width:100%;accent-color:#d4af37}
#status{opacity:.85;margin-top:10px;font-size:.86rem}
.note{opacity:.45;font-size:.72rem;max-width:340px;margin-top:16px}
</style></head>
<body>
<video id="hero" autoplay muted loop playsinline webkit-playsinline></video>
<div class="wash"></div>
<h1>BINAURAL STUDIO</h1>
<button id="setHero" type="button">Set hero loop</button>
<input id="heroFile" type="file" accept="video/*" hidden>
<div class="row" id="modes"></div>
<div class="row">
<button class="n on" data-s="none">None</button>
<button class="n" data-s="ocean">Ocean</button>
<button class="n" data-s="rain">Rain</button>
<button class="n" data-s="storm">Rainstorm</button>
</div>
<div class="row">
<button class="t on" data-m="0">Timer off</button>
<button class="t" data-m="15">15 min</button>
<button class="t" data-m="30">30 min</button>
<button class="t" data-m="60">60 min</button>
</div>
<button id="play">Play</button>
<div class="vol">Master <input id="mv" type="range" min="0" max="100" value="75"></div>
<div class="vol">Binaural <input id="bv" type="range" min="0" max="100" value="30"></div>
<div class="vol">Music <input id="uv" type="range" min="0" max="100" value="22"></div>
<div class="vol">Nature <input id="nv" type="range" min="0" max="100" value="45"></div>
<div id="status">Calm / Sleep ready. Tap Set hero loop, then Play.</div>
<p class="note">Headphones required. Choose the dusk sofa clip once and it loops behind every mode.</p>
<script>
const MODES=[{name:'Deep Sleep',freq:2},{name:'Calm / Sleep',freq:4},{name:'Relax',freq:6},{name:'De-stress',freq:10},{name:'Focus',freq:15}];
let ctx,leftOsc,rightOsc,bG,mG,nG,xG,playing=false,mode=MODES[1],nature='none',musicNodes=[],natureNodes=[];
const status=document.getElementById('status'),playBtn=document.getElementById('play'),hero=document.getElementById('hero'),box=document.getElementById('modes');
document.getElementById('setHero').onclick=()=>document.getElementById('heroFile').click();
document.getElementById('heroFile').onchange=e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  hero.src=URL.createObjectURL(f);
  hero.play().catch(()=>{});
  status.textContent='Hero loop on · '+mode.name;
};
function kickHero(){hero.play().catch(()=>{});}
document.body.addEventListener('pointerdown',kickHero,{once:true});
MODES.forEach((m,i)=>{const b=document.createElement('button');b.innerHTML=m.name+'<br>'+m.freq+' Hz';if(i===1)b.classList.add('on');b.onclick=()=>{document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=m;status.textContent=m.name+' · '+m.freq+' Hz';if(playing)startBin()};box.appendChild(b)});
document.querySelectorAll('.n').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.n').forEach(x=>x.classList.remove('on'));b.classList.add('on');nature=b.dataset.s;if(playing)startNat()}});
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();xG=ctx.createGain();xG.gain.value=.75;xG.connect(ctx.destination);bG=ctx.createGain();bG.gain.value=.3;bG.connect(xG);mG=ctx.createGain();mG.gain.value=.22;mG.connect(xG);nG=ctx.createGain();nG.gain.value=.45;nG.connect(xG)}
function stopList(list){list.forEach(n=>{try{n.stop&&n.stop();n.disconnect()}catch(e){}})}
function stopAll(){try{leftOsc&&leftOsc.stop();rightOsc&&rightOsc.stop()}catch(e){}leftOsc=rightOsc=null;stopList(musicNodes);stopList(natureNodes);musicNodes=[];natureNodes=[]}
function startBin(){try{leftOsc&&leftOsc.stop();rightOsc&&rightOsc.stop()}catch(e){}leftOsc=ctx.createOscillator();rightOsc=ctx.createOscillator();leftOsc.type=rightOsc.type='sine';leftOsc.frequency.value=200;rightOsc.frequency.value=200+mode.freq;const lp=ctx.createStereoPanner();lp.pan.value=-1;const rp=ctx.createStereoPanner();rp.pan.value=1;leftOsc.connect(lp).connect(bG);rightOsc.connect(rp).connect(bG);leftOsc.start();rightOsc.start()}
function noise(){const buf=ctx.createBuffer(2,ctx.sampleRate*2,ctx.sampleRate);for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;return s}
function startNat(){stopList(natureNodes);natureNodes=[];if(nature==='none')return;const s=noise(),f=ctx.createBiquadFilter();if(nature==='ocean'){f.type='lowpass';f.frequency.value=420;s.connect(f).connect(nG);s.start();natureNodes.push(s,f)}else if(nature==='rain'){f.type='highpass';f.frequency.value=1800;const g=ctx.createGain();g.gain.value=.28;s.connect(f).connect(g).connect(nG);s.start();natureNodes.push(s,f,g)}else{f.type='bandpass';f.frequency.value=2200;const g=ctx.createGain();g.gain.value=.22;s.connect(f).connect(g).connect(nG);const r=noise(),rf=ctx.createBiquadFilter();rf.type='lowpass';rf.frequency.value=140;r.connect(rf).connect(nG);s.start();r.start();natureNodes.push(s,f,g,r,rf)}}
function startMus(){stopList(musicNodes);musicNodes=[];[130.81,164.81,196,246.94].forEach((fq,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=fq;const g=ctx.createGain();g.gain.value=.08;const l=ctx.createOscillator();l.frequency.value=.04+i*.015;const lg=ctx.createGain();lg.gain.value=.05;l.connect(lg).connect(g.gain);o.connect(g).connect(mG);o.start();l.start();musicNodes.push(o,l,g,lg)})}
playBtn.onclick=async()=>{kickHero();try{init();if(ctx.state==='suspended')await ctx.resume();if(playing){stopAll();playing=false;playBtn.textContent='Play';playBtn.classList.remove('on');status.textContent=mode.name+' · paused'}else{startBin();startMus();startNat();playing=true;playBtn.textContent='Stop';playBtn.classList.add('on');status.textContent=mode.name+' · '+mode.freq+' Hz playing'}}catch(e){status.textContent='Tap Play once more to unlock sound'}};
document.getElementById('mv').oninput=e=>{if(xG)xG.gain.value=e.target.value/100};
document.getElementById('bv').oninput=e=>{if(bG)bG.gain.value=e.target.value/100};
document.getElementById('uv').oninput=e=>{if(mG)mG.gain.value=e.target.value/100};
document.getElementById('nv').oninput=e=>{if(nG)nG.gain.value=e.target.value/100};
</script>
</body></html>
